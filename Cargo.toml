[workspace]
resolver = "3"
members = ["crates/*", "tests/e2e"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/diverofdark/gitimage"

[workspace.dependencies]
gitimage-api = { path = "crates/gitimage-api" }
gitimage-git = { path = "crates/gitimage-git" }
gitimage-oci = { path = "crates/gitimage-oci" }
gitimage-controller = { path = "crates/gitimage-controller" }
gitimage-webhook = { path = "crates/gitimage-webhook" }
gitimage-node = { path = "crates/gitimage-node" }

kube = { version = "5.0.0", default-features = false, features = ["runtime", "derive", "client", "admission", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.29.0", features = ["v1_33", "schemars"] }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1.54.1", features = ["full"] }
futures = "0.3"
async-trait = "0.1.92"
bytes = "1.12.1"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "2"
anyhow = "1"
humantime = "2.4.0"
sha2 = "0.11"
hmac = "0.13.0"
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream", "json"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.29.1", features = ["v4"] }
base64 = "0.23.1"
hex = "0.4"
insta = { version = "1.49.0", features = ["yaml"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
