# One pipeline: checks -> one cached build -> e2e matrix -> (main only) release + docs.
# Runners: repository variable RUNS_ON (e.g. the homelab scale set `gitimage-e2e`) for every
# job, GitHub-hosted when unset. Pull requests from forks always use GitHub-hosted runners, so
# outside code never runs on self-hosted hardware. arm64 builds always use GitHub's arm runner.
# A push to main is released as v<major>.<minor>.<run number> only when every check and every
# e2e job passed.
name: pipeline
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  # PRs: newer pushes cancel older runs. main: runs queue, so a release is never cut in half.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/diverofdark/gitimage

jobs:
  version:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.RUNS_ON || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*/\1/p' Cargo.toml | head -1)
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$base.${{ github.run_number }}-ci" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: C toolchain (self-hosted runner images have none)
        run: command -v cc >/dev/null || (sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends build-essential)
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99", components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: check, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: azure/setup-helm@v4
      - run: helm lint charts/gitimage --set buildPolicy.isolation.mode=userns --set storage.registry.url=r/b --set storage.registry.pushSecret=p
      - run: ./hack/check-chart-config.sh
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-deny }
      - run: cargo deny check

  oci-conformance:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: C toolchain (self-hosted runner images have none)
        run: command -v cc >/dev/null || (sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends build-essential)
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99" }
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: conformance, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: false }
      - run: hack/oci-conformance.sh

  # Built once on bookworm (glibc 2.36): the binary runs in distroless and on any runner; the
  # e2e jobs only download it, so no e2e job compiles Rust.
  build:
    needs: version
    strategy:
      matrix:
        include:
          - { arch: amd64 }
          - { arch: arm64 }
    # arm64 always builds on GitHub's arm runner (no arm nodes on the homelab).
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.RUNS_ON || 'ubuntu-24.04' }}
    # Self-hosted: Docker Hub through DOCKERHUB_PREFIX (a path-style proxy cache), avoiding rate limits.
    container: ${{ matrix.arch == 'amd64' && vars.RUNS_ON && vars.DOCKERHUB_PREFIX && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && format('{0}library/rust:1.99-bookworm', vars.DOCKERHUB_PREFIX) || 'rust:1.99-bookworm' }}
    env:
      GITIMAGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: "release-${{ matrix.arch }}", save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: cargo build --release --locked -p gitimage
      - name: e2e test binary (release profile, shares the build above)
        if: matrix.arch == 'amd64'
        run: |
          bin=$(cargo test --release --locked -p e2e --test flow --no-run --message-format=json \
            | grep -o '"executable":"[^"]*"' | cut -d'"' -f4 | grep '/flow-' | tail -1)
          mkdir -p dist && cp "$bin" dist/e2e-flow
      - run: mkdir -p dist && cp target/release/gitimage dist/gitimage-${{ matrix.arch }} && dist/gitimage-${{ matrix.arch }} version
      - uses: actions/upload-artifact@v4
        with: { name: "dist-${{ matrix.arch }}", path: dist/, retention-days: 7 }

  e2e:
    needs: build
    # E2E_RUNS_ON can send only e2e elsewhere; otherwise the same runner as every job.
    # Isolations listed in E2E_GITHUB_ISOLATIONS always run on GitHub-hosted runners (e.g.
    # gvisor on hosts with user.max_user_namespaces=0, such as Talos defaults).
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || contains(fromJSON(vars.E2E_GITHUB_ISOLATIONS || '[]'), matrix.isolation)) && 'ubuntu-latest' || vars.E2E_RUNS_ON || vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        storage: [registry, s3]
        # userns cannot run inside kind (runc cannot mount sysfs in a userns pod on a
        # containerized node). kata-qemu needs /dev/kvm: set E2E_ISOLATIONS on KVM runners.
        isolation: ${{ fromJSON(vars.E2E_ISOLATIONS || '["privileged","gvisor"]') }}
        # Sysbox always runs, whatever E2E_ISOLATIONS says (hack/e2e/sysbox.sh installs it into
        # the kind worker). Listing sysbox in E2E_ISOLATIONS as well adds no duplicate jobs.
        include:
          - { storage: registry, isolation: sysbox }
          - { storage: s3, isolation: sysbox }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist-amd64, path: dist }
      - uses: azure/setup-helm@v4
      - name: Tools
        run: |
          chmod +x dist/e2e-flow   # not gitimage-amd64: the image build must set its mode itself
          command -v ssh-keyscan >/dev/null || (sudo apt-get update -q && sudo apt-get install -yq openssh-client)
      - name: e2e ${{ matrix.storage }} / ${{ matrix.isolation }}
        env:
          GITIMAGE_BINARY: dist/gitimage-amd64
          E2E_DOCKERHUB_PREFIX: ${{ runner.environment == 'self-hosted' && vars.DOCKERHUB_PREFIX || '' }}
          E2E_TEST_BIN: dist/e2e-flow
          CLUSTER: gitimage-e2e
        run: ./hack/e2e/run.sh ${{ matrix.storage }} ${{ matrix.isolation }}
      - name: Dump state on failure
        if: failure()
        run: |
          export KUBECONFIG=$PWD/hack/.kubeconfig PATH=$PWD/hack/bin:$PATH
          kubectl get pods,jobs,gitimages -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | grep -v Normal | tail -40 || true
          for n in $(kind get nodes --name "${CLUSTER:-gitimage-e2e}" 2>/dev/null); do
            docker exec "$n" sh -c 'journalctl -u containerd --no-pager --since "-10min" | grep -iE "error|fail" | tail -20' || true
          done
          kubectl -n gitimage-system logs -l app.kubernetes.io/name=gitimage --tail=300 --prefix || true
      - name: Clean up
        if: always()
        run: ./hack/e2e/down.sh || true

  release:
    needs: [version, check, oci-conformance, build, e2e]
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: dist-*, path: dist, merge-multiple: true }
      - uses: docker/setup-buildx-action@v3
        with: { driver-opts: "image=${{ vars.RUNS_ON && vars.DOCKERHUB_PREFIX || 'docker.io/' }}moby/buildkit:buildx-stable-1" }
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Multi-arch image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: dist
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }},${{ env.IMAGE }}:latest
          sbom: true
          provenance: mode=max
      # No QEMU: the image only COPYs prebuilt binaries (no RUN), and the arm64 binary already
      # ran natively in its build job. amd64 exercises the same Dockerfile (--chmod) natively.
      - name: Smoke-test the pushed image
        run: |
          out=$(docker run --rm --platform linux/amd64 "$IMAGE:$VERSION" version)
          echo "$out"; [ "$out" = "gitimage $VERSION" ]
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "$IMAGE@${{ steps.image.outputs.digest }}"
      - uses: azure/setup-helm@v4
      - name: Helm chart
        run: |
          sed -i "s/^version: .*/version: $VERSION/; s/^appVersion: .*/appVersion: \"$VERSION\"/" charts/gitimage/Chart.yaml
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/gitimage -d dist
          helm push "dist/gitimage-$VERSION.tgz" oci://ghcr.io/diverofdark/charts
      - name: GitHub release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cd dist && for a in amd64 arm64; do tar -czf "gitimage-$VERSION-linux-$a.tar.gz" "gitimage-$a"; done
          gh release create "v$VERSION" --target "${{ github.sha }}" --title "v$VERSION" --generate-notes \
            --notes "Image: \`$IMAGE:$VERSION\` (\`${{ steps.image.outputs.digest }}\`, cosign-signed). Chart: \`helm install gitimage oci://ghcr.io/diverofdark/charts/gitimage --version $VERSION\`" \
            "gitimage-$VERSION-linux-amd64.tar.gz" "gitimage-$VERSION-linux-arm64.tar.gz" "gitimage-$VERSION.tgz"

  docs:
    needs: [version, release]
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      pages: write
      id-token: write
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with: { tool: mdbook }
      - run: |
          sed -i "s/{{VERSION}}/${{ needs.version.outputs.version }}/g" docs/src/*.md
          mdbook build docs
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs/book }
      - id: deploy
        uses: actions/deploy-pages@v4
