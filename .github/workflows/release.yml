name: release
on:
  push: { tags: ["v*"] }

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gitimage

jobs:
  image:
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
      - run: |
          mkdir -p /tmp/digests && d="${{ steps.build.outputs.digest }}" && touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with: { name: "digest-${{ strategy.job-index }}", path: /tmp/digests/*, retention-days: 1 }

  manifest:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: /tmp/digests, pattern: digest-*, merge-multiple: true }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: sigstore/cosign-installer@v3
      - name: Create and sign the multi-arch image
        run: |
          tag="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t "$IMAGE:$tag" -t "$IMAGE:latest" \
            $(cd /tmp/digests && printf "$IMAGE@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "$IMAGE@$digest"

  chart:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i "s/^version: .*/version: $v/; s/^appVersion: .*/appVersion: \"$v\"/" charts/gitimage/Chart.yaml
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/gitimage
          helm push "gitimage-$v.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
