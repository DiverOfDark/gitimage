image:
  repository: ghcr.io/diverofdark/gitimage
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

logFormat: json
logLevel: info,kube=warn

buildPolicy:
  isolation:
    # Required, no default (PRD N1): runtimeClass | userns | privileged
    mode: ""
    # For mode runtimeClass: kata, kata-qemu, kata-fc, gvisor, ...
    runtimeClassName: ""
    # Must be true to use mode privileged. Trusted repos only.
    allowPrivileged: false
    # runtimeClass only: rootful BuildKit, privileged INSIDE the sandbox. Required for Kata
    # (its shared filesystem drops the file caps rootless BuildKit needs). Safe only when the
    # runtime keeps privileged in the guest: containerd privileged_without_host_devices = true
    # (the kata-deploy default).
    privilegedInSandbox: false
    # runtimeClass only: rootful BuildKit as an UNPRIVILEGED container in a pod user namespace
    # (hostUsers: false). For Sysbox (runtimeClassName: sysbox-runc), which virtualizes
    # procfs/sysfs; build pods then pass Pod Security baseline. Excludes privilegedInSandbox.
    rootfulInSandbox: false
  egress:
    allowInternet: true
    denyClusterCIDRs: true

storage:
  # registry | s3
  type: registry
  registry:
    # Images land at <url>/<namespace>/<gitimage>:<sha>
    url: ""
    # Secret in the release namespace (type kubernetes.io/dockerconfigjson) with push credentials.
    pushSecret: ""
    # Optional Secret (dockerconfigjson) copied into tenant namespaces as gitimage-pull.
    pullSecret: ""
    # Plain HTTP to the registry (tests only).
    insecure: false
  s3:
    bucket: ""
    endpoint: ""
    region: us-east-1
    # Secret in the release namespace with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
    secret: ""
    # Optional read-only credentials for gitimage-node; defaults to `secret`.
    readOnlySecret: ""
    pathStyle: true

build:
  image: moby/buildkit:v0.34.2-rootless
  rootfulImage: moby/buildkit:v0.34.2
  activeDeadline: 1h
  platforms: [linux/amd64]
  # max | min | off
  cache: max
  labels: {}
  extraOpts: {}
  # BuildKit's state volume: an emptyDir by default. On Kata nodes whose virtiofs shares lack
  # xattr support (Talos) builds fail with "failed to create hash ...: operation not supported";
  # use `block` there: a raw block (volumeMode: Block) ephemeral PVC per build, formatted by an
  # init container and mounted by BuildKit (needs privileged or privilegedInSandbox).
  # medium: Memory (tmpfs) also works but counts against the build pod's memory.
  stateVolume:
    medium: ""
    sizeLimit: ""
    block: {}
    # block:
    #   storageClassName: ceph-block
    #   size: 20Gi
    #   fsType: ext4                         # or ext3
    #   formatImage: debian:bookworm-slim    # provides mkfs.<fsType>
  # Appended to the build pods' buildkitd.toml: registry mirrors, private/plain-HTTP registries.
  buildkitdConfig: ""
    # [registry."docker.io"]
    #   mirrors = ["mirror.example.com"]
  defaultResources: {}
    # requests: { cpu: "1", memory: 2Gi }
    # limits: { memory: 4Gi }

network:
  # Pod and Service CIDRs denied to build egress, e.g. [10.244.0.0/16, 10.96.0.0/12]
  clusterCIDRs: []

controller:
  replicas: 2
  extraEnv: []
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  nodeSelector: {}
  tolerations: []
  affinity: {}

webhook:
  replicas: 2
  timeoutSeconds: 5
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }
  nodeSelector: {}
  tolerations: []
  affinity: {}

node:
  # hostNetwork ports on 127.0.0.1; see the design doc before changing.
  port: 25050
  healthPort: 25051
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }
  priorityClassName: ""

hooks:
  # Public base URL of the hooks Ingress, e.g. https://gitimage.example.com
  baseURL: ""
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls: []

# Read-only status UI served by the controller on port 8082: every GitImage, live build logs,
# the workloads using an image and the pods waiting for one.
ui:
  enabled: false
  # Public URL of the UI, e.g. https://gitimage.example.com. Required for auth.mode oidc.
  baseURL: ""
  auth:
    # none: no login; every visitor sees what the controller's ServiceAccount sees. Use only
    #       with `kubectl port-forward svc/gitimage-ui 8082` or behind an authenticating proxy.
    # oidc: login against an issuer that the Kubernetes API server also trusts. The UI sends
    #       the user's ID token to the API server, so cluster RBAC decides what they see.
    mode: none
    oidc:
      # Exactly as in the API server's authentication configuration.
      issuer: ""
      # Must be one of the API server's accepted audiences. Register
      # <baseURL>/auth/callback as a redirect URI of this client.
      clientID: ""
      # Secret in the release namespace with the keys `clientSecret` (omit for a public
      # PKCE client) and optionally `clientID` (overrides the value above).
      existingSecret: ""
      scopes: [openid, email, profile]
      # ID token claim shown as the user name.
      usernameClaim: email
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls: []

podMonitor:
  enabled: false

# Extra Kubernetes objects installed with the release. Maps or templated strings
# (`tpl` is applied, so "{{ .Release.Namespace }}" works).
extraObjects: []
  # - apiVersion: objectbucket.io/v1alpha1
  #   kind: ObjectBucketClaim
  #   metadata: { name: gitimage, namespace: "{{ .Release.Namespace }}" }
  #   spec: { bucketName: gitimage, storageClassName: ceph-bucket }
